.sub-hero p{margin-top:15px;max-width:490px;color:#cbc5c9}
.sub-hero h1{margin-top:14px}
.shop-section,.checkout-section,.download-section{padding-top:35px;padding-bottom:75px}
.shop-wrap,.checkout-wrap,.download-wrap{max-width:780px}
.selector-card,.checkout-card,.download-card{background:#fff;color:#171616;border:1px solid #ded9d4;border-radius:4px;padding:clamp(18px,4vw,30px)}
.selector-label{font:11px/1.5 var(--label);letter-spacing:.09em;color:#625d5b;margin-bottom:12px}
.selector-label.step-two{margin-top:30px}
.level-grid{display:grid;grid-template-columns:1fr;gap:9px}
.choice{color:#171616;display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border:1px solid #d4ccc7;border-radius:4px;background:#f8f7f5;text-align:left;gap:10px;min-height:53px}
.choice-main{font-size:15px;font-weight:700}
.choice-indicator{width:18px;height:18px;border:1px solid #aaa;border-radius:50%;flex:none;position:relative}
.choice.is-selected{border-color:var(--pink);background:#fff5f9;box-shadow:inset 0 0 0 1px var(--pink)}
.choice.is-selected .choice-indicator{border:5px solid var(--pink);background:#fff}
.days-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day-choice{color:#171616;border:1px solid #d4ccc7;background:#f8f7f5;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:13px 4px;min-height:64px}
.day-choice b{font:900 21px/1 var(--head)}.day-choice small{font:9px var(--label)}
.day-choice.is-selected{background:var(--pink);border-color:var(--pink);color:#fff}
.selected-summary{margin-top:26px;padding:20px 0 0;border-top:1px solid #e2ded9}
.selected-summary h3{font-size:clamp(25px,6vw,35px);margin:6px 0 9px}
.selected-summary strong{display:block;font:950 clamp(27px,7vw,37px)/1 var(--head);color:var(--pink);margin-bottom:20px}
.checklist{margin:0 0 14px;padding:0;list-style:none}
.checklist li{font-size:13px;line-height:1.45;color:#4d4845;padding:8px 0 8px 24px;position:relative;border-bottom:1px solid #ece8e4}
.checklist li:before{content:'✓';position:absolute;left:0;color:var(--pink);font-weight:bold}
.small-disclaimer{font-size:11px;line-height:1.55;color:#756e6b;margin:15px 0 20px}
.selector-side{display:none}
.selector-side img{object-fit:cover;height:265px;border-radius:4px}
.selector-side p{font-family:var(--head);font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1.05;margin-top:15px;color:#242021}
.checkout-product{display:flex;gap:15px;align-items:center}
.checkout-product img{width:105px;height:100px;border-radius:3px;flex:none}
.checkout-product h3{font-size:clamp(22px,5.5vw,32px);margin:4px 0 10px}
.checkout-price{font:950 26px/1 var(--head);color:var(--pink)}
.checkout-features{margin-top:20px;margin-bottom:10px}
.field-label{font-size:12px;font-weight:800;display:block;margin-top:24px}
.field-label input{font:14px Arial,sans-serif;display:block;width:100%;border:1px solid #cbc4c1;background:#faf9f8;color:#171616;border-radius:3px;padding:15px;margin-top:9px}
.field-hint{font-size:11px;color:#77716f;margin:10px 0 21px}
.payment-panel{border-top:1px solid #e5e0dc;padding-top:20px;margin-bottom:15px}
.payment-row{border:1px solid #d0c9c5;border-radius:4px;padding:15px 16px;display:flex;gap:3px;flex-direction:column}
.payment-row b{font-size:13px}.payment-row small{font-size:11px;color:#777}
.demo-info{background:#f6f1f3;border-left:3px solid var(--pink);padding:13px;display:flex;flex-direction:column;gap:5px;margin-bottom:18px}
.demo-info b{font-size:12px}.demo-info span{font-size:12px;line-height:1.5;color:#5c5556}

{id:'personalizado',number:'02',title:'PLANES<br>PERSONALIZADOS',desc:'Entrenamiento y alimentación personalizados, con atención directa de Noelia.',img:'weights.webp',price:'PRECIO A CONFIRMAR',features:['Evaluación y planificación individual','Entrenamiento y alimentación a medida','Seguimiento según las condiciones acordadas'],cta:'CONSULTAR POR WHATSAPP',action:'personalizado'}

const offer=(x)=>`<article class="offer reveal"><div class="offer-image"><img src="${asset(x.img)}" alt="Fotografía de entrenamiento"><span class="figure-num">PLAN ${x.number}</span></div><div class="offer-info">${label(x.id==='integral'?'RUTINAS DIGITALES / DESDE $50.000':'ATENCIÓN PERSONALIZADA',true)}<h3 class="offer-title">${x.title}</h3><p>${x.desc}</p><div class="offer-price">${x.price}</div><div class="feature-list">${x.features.map((f,i)=>`<div class="feature"><small>${String(i+1).padStart(2,'0')}</small><span>${f}</span></div>`).join('')}</div>${button(x.cta,x.action,'darkbtn')}<p class="note">${x.id==='integral'?'SELECCIÓN Y COMPRA SIMULADAS EN ESTA DEMO':'CONSULTA PERSONAL · SIN COMPRA AUTOMÁTICA'}</p></div></article>`;

const routes={inicio:home,entrenamientos:trainings,rutina:routine,pago:checkout,confirmacion:success,contacto:contact};
function setMenu(open){menu.classList.toggle('open',open);menu.setAttribute('aria-hidden',String(!open));menu.inert=!open;header.querySelector('#openMenu').setAttribute('aria-expanded',String(open));document.body.classList.toggle('menu-open',open);if(open)document.getElementById('closeMenu').focus()}
function render(route){current=routes[route]?route:'inicio';setMenu(false);main.innerHTML=routes[current]();window.scrollTo({top:0,behavior:'instant'});document.querySelectorAll('.menu-links a').forEach(a=>a.classList.toggle('current',a.dataset.route===current));if(current==='contacto')main.querySelector('select[name="plan"]').value=interest;if(obs)obs.disconnect();if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion:reduce)').matches){obs=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){x.target.classList.add('is-visible');obs.unobserve(x.target)}}),{threshold:.08});main.querySelectorAll('.reveal').forEach(el=>obs.observe(el))}else main.querySelectorAll('.reveal').forEach(el=>el.classList.add('is-visible'));scrollTheme()}
function goto(route){const hash='#'+route;if(location.hash===hash)render(route);else location.hash=hash}
function scrollTheme(){let isLight=[...main.querySelectorAll('[data-theme="light"]')].some(el=>{const b=el.getBoundingClientRect();return b.top<70&&b.bottom>70});header.classList.toggle('light',isLight);header.classList.toggle('scrolled',window.scrollY>15)}
function notify(t){clearTimeout(toastTimer);toast.textContent=t;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function syncRoutine(){
  main.querySelectorAll('[data-level]').forEach(b=>{const on=b.dataset.level===chosenLevel;b.classList.toggle('is-selected',on);b.setAttribute('aria-pressed',String(on))});
  main.querySelectorAll('[data-days]').forEach(b=>{const on=Number(b.dataset.days)===chosenDays;b.classList.toggle('is-selected',on);b.setAttribute('aria-pressed',String(on))});
  const n=main.querySelector('#selected-label'),p=main.querySelector('#selected-price');
  if(n)n.textContent=`${levelNames[chosenLevel]} · ${chosenDays} días`;
  if(p)p.textContent=`${price(chosenDays)} ARS`;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#openMenu')){setMenu(true);return}
  if(e.target.closest('#closeMenu')){setMenu(false);return}
  const lvl=e.target.closest('[data-level]');if(lvl){chosenLevel=lvl.dataset.level;syncRoutine();return}
  const day=e.target.closest('[data-days]');if(day){chosenDays=Number(day.dataset.days);syncRoutine();return}
  const link=e.target.closest('[data-route]');if(link){e.preventDefault();goto(link.dataset.route);return}
  const b=e.target.closest('[data-action]');if(b){const act=b.dataset.action;
    if(act==='personalizado'){interest='personalizado';goto('contacto')}
    else if(['inicio','entrenamientos','contacto','rutina','pago','confirmacion'].includes(act))goto(act);
  }
});
document.addEventListener('submit',e=>{
 if(e.target.id==='checkout-form'){
  e.preventDefault();if(!e.target.reportValidity())return;
  checkoutEmail=String(new FormData(e.target).get('email')||'').slice(0,140);
  goto('confirmacion');notify('Simulación completada · No se realizó ningún cobro.');return;
 }
 if(e.target.id!=='contact-form')return;
 e.preventDefault();const f=new FormData(e.target);
 const plan={general:'Consulta general',integral:'Asesoría integral online',personalizado:'Planes personalizados'}[f.get('plan')]||'Consulta general';
 const msg=`Hola Noelia, soy ${f.get('name')}. Me interesa: ${plan}.${f.get('message')?' '+f.get('message'):''}`;
 const target=document.getElementById('message-preview');target.hidden=false;target.textContent=msg;
 document.getElementById('copy-message').hidden=false;notify('Consulta preparada para copiar. No fue enviada.');
});
document.addEventListener('click',async e=>{if(e.target.closest('#copy-message')){const msg=document.getElementById('message-preview')?.textContent||'';try{await navigator.clipboard.writeText(msg);notify('Texto copiado')}catch{notify('Seleccioná el texto para copiarlo')}}});
document.getElementById('openMenu').addEventListener('click',()=>setMenu(true));document.getElementById('closeMenu').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});window.addEventListener('hashchange',()=>render(decodeURIComponent(location.hash.slice(1))));window.addEventListener('scroll',scrollTheme,{passive:true});render(decodeURIComponent(location.hash.slice(1)||'inicio'));

</script></body></html>
