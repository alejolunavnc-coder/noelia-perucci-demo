.sub-hero p{margin-top:15px;max-width:490px;color:#cbc5c9}
.sub-hero h1{margin-top:14px}
.shop-section,.checkout-section,.download-section{padding-top:35px;padding-bottom:75px}
.shop-wrap,.checkout-wrap,.download-wrap{max-width:780px}
.selector-card,.checkout-card,.download-card{background:#fff;color:#171616;border:1px solid #ded9d4;border-radius:4px;padding:clamp(18px,4vw,30px)}
.selector-label{font:11px/1.5 var(--label);letter-spacing:.09em;color:#625d5b;margin-bottom:12px}
.selector-label.step-two{margin-top:30px}
.level-grid{display:grid;grid-template-columns:1fr;gap:9px}
.choice{color:#171616;display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border:1px solid #d4ccc7;border-radius:4px;background:#f8f7f5;text-align:left;gap:10px;min-height:53px}
.choice-main{font-size:15px;font-weight:700}
.choice-indicator{width:18px;height:18px;border:1px solid #aaa;border-radius:50%;flex:none;position:relative}
.choice.is-selected{border-color:var(--pink);background:#fff5f9;box-shadow:inset 0 0 0 1px var(--pink)}
.choice.is-selected .choice-indicator{border:5px solid var(--pink);background:#fff}
.days-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day-choice{color:#171616;border:1px solid #d4ccc7;background:#f8f7f5;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:13px 4px;min-height:64px}
.day-choice b{font:900 21px/1 var(--head)}.day-choice small{font:9px var(--label)}
.day-choice.is-selected{background:var(--pink);border-color:var(--pink);color:#fff}
.selected-summary{margin-top:26px;padding:20px 0 0;border-top:1px solid #e2ded9}
.selected-summary h3{font-size:clamp(25px,6vw,35px);margin:6px 0 9px}
.selected-summary strong{display:block;font:950 clamp(27px,7vw,37px)/1 var(--head);color:var(--pink);margin-bottom:20px}
.checklist{margin:0 0 14px;padding:0;list-style:none}
.checklist li{font-size:13px;line-height:1.45;color:#4d4845;padding:8px 0 8px 24px;position:relative;border-bottom:1px solid #ece8e4}
.checklist li:before{content:'';position:absolute;left:3px;top:12px;width:7px;height:12px;border:solid var(--pink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.small-disclaimer{font-size:11px;line-height:1.55;color:#756e6b;margin:15px 0 20px}
.selector-side{display:none}
.selector-side img{object-fit:cover;height:265px;border-radius:4px}
.selector-side p{font-family:var(--head);font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1.05;margin-top:15px;color:#242021}
.checkout-product{display:flex;gap:15px;align-items:center}
.checkout-product img{width:105px;height:100px;border-radius:3px;flex:none}
.checkout-product h3{font-size:clamp(22px,5.5vw,32px);margin:4px 0 10px}
.checkout-price{font:950 26px/1 var(--head);color:var(--pink)}
.checkout-features{margin-top:20px;margin-bottom:10px}
.field-label{font-size:12px;font-weight:800;display:block;margin-top:24px}
.field-label input{font:14px Arial,sans-serif;display:block;width:100%;border:1px solid #cbc4c1;background:#faf9f8;color:#171616;border-radius:3px;padding:15px;margin-top:9px}
.field-hint{font-size:11px;color:#77716f;margin:10px 0 21px}
.payment-panel{border-top:1px solid #e5e0dc;padding-top:20px;margin-bottom:15px}
.payment-row{border:1px solid #d0c9c5;border-radius:4px;padding:15px 16px;display:flex;gap:3px;flex-direction:column}
.payment-row b{font-size:13px}.payment-row small{font-size:11px;color:#777}
.demo-info{background:#f6f1f3;border-left:3px solid var(--pink);padding:13px;display:flex;flex-direction:column;gap:5px;margin-bottom:18px}
.demo-info b{font-size:12px}.demo-info span{font-size:12px;line-height:1.5;color:#5c5556}

.download-card h2{margin:9px 0 16px}.download-card p:not(.small-disclaimer){font-size:14px;color:#57514e;margin:17px 0 20px}
.download-card .btn{margin:13px 0}
.contact-hero h1{font-size:clamp(34px,9vw,61px);max-width:720px}

/* V4.1 — Contraste de los controles sobre fondos claros */
.choice:focus-visible,.day-choice:focus-visible{outline:3px solid #171616;outline-offset:3px}
.choice.is-selected{color:#171616}
.day-choice.is-selected{color:#fff}

/* V4.1: INICIO UN DÍA A LA VEZ + RESULTADOS REALES PENDIENTES DE FOTOS */
.habit-hero{min-height:min(96svh,875px);padding-bottom:44px}
.habit-hero .eyebrow{color:#e9a6cb}
.habit-hero h1{max-width:750px;font-size:clamp(49px,13vw,86px);letter-spacing:-.065em;line-height:.96}
.habit-hero .habit-period{color:var(--pink)}
.habit-hero p{max-width:620px;color:#e6e0e1;font-size:clamp(14px,3.8vw,17px);line-height:1.64;margin-top:24px;margin-bottom:26px;text-wrap:pretty}
.habit-actions{display:grid;gap:10px;max-width:490px}
.habit-hero .btn.outline{border-color:#aaa5a9;background:#1413169c;color:#fff}
.habit-hero .hero-end{margin-top:33px}
.real-results{background:#101011;border-top:1px solid #292729;border-bottom:1px solid #292729;padding-top:62px;padding-bottom:68px}
.results-heading h2{margin:12px 0 15px;line-height:.95}
.results-heading p{color:#c6bec3;max-width:600px;font-size:14px;line-height:1.65;margin-bottom:26px}
.results-future{max-width:620px;border:1px solid #454044;border-radius:5px;overflow:hidden;background:#1b1a1c}
.results-mock{display:grid;grid-template-columns:1fr 1fr;min-height:225px;aspect-ratio:1.65/1;max-height:390px}
.result-half{display:flex;align-items:stretch;justify-content:space-between;flex-direction:column;padding:18px;background:linear-gradient(160deg,#363338,#151517);border-right:1px solid #494449}
.result-half+ .result-half{border:0;background:linear-gradient(160deg,#272528,#100f11)}
.result-half>span{font:10px/1.4 var(--label);letter-spacing:.14em;color:#c9c5c8}
.result-half strong{font:950 clamp(65px,21vw,170px)/.8 var(--head);letter-spacing:-.1em;color:#ffffff11;text-align:right}
.results-caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;border-top:1px solid #454044;font:10px/1.5 var(--label);letter-spacing:.08em;color:#e3dfe0}
.results-arrow{font-size:21px;color:var(--pink)}
.results-fine{max-width:630px;color:#969094;font-size:11px;margin-top:15px;line-height:1.55}

.header .brand{font-size:clamp(18px,5.2vw,27px);white-space:nowrap;letter-spacing:-.055em}
h1,h2,h3,.offer-title{overflow-wrap:break-word}
@media(max-width:359px){.header .brand{font-size:18px}}

/* Bio profesional Noelia 2026-11-03 — acordeón nativo y accesible */
.about .bio-closing{font-size:clamp(14px,1.6vw,17px);line-height:1.7;color:#e7e1e5;margin:16px 0 27px}
.about .bio-closing strong{color:#f26cae;font-weight:800}
.about .bio-credentials{width:100%;max-width:660px;margin-top:25px;border-top:1px solid #ffffff32}
.about .bio-details{border-bottom:1px solid #ffffff32}
.about .bio-details>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;list-style:none;padding:21px 2px;color:#fff;transition:color .2s}
.about .bio-details>summary::-webkit-details-marker{display:none}
.about .bio-details>summary:hover,.about .bio-details[open]>summary{color:#ff83bf}
.about .bio-details>summary:focus-visible{outline:2px solid #ff83bf;outline-offset:3px;border-radius:2px}
.about .bio-details>summary>span:first-child{display:flex;flex-direction:column;gap:5px;min-width:0}
.about .bio-details>summary small{font-size:10px;letter-spacing:.09em;color:#cf6e9f;font-weight:500}
.about .bio-details>summary strong{font-size:clamp(12px,2.8vw,15px);font-weight:750;line-height:1.35}
.about .bio-count{font-size:12px;white-space:nowrap;color:#c8bcc4;display:inline-flex;align-items:center;gap:10px}
.about .bio-chevron{font-size:24px;line-height:1;transition:transform .25s}
.about .bio-details[open] .bio-chevron{transform:rotate(45deg)}
.about .bio-details-panel{padding:0 0 14px}
.about .bio-details-panel .credential{padding:11px 0;display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start}
.about .bio-details-panel .credential code{color:#ef71b1;white-space:nowrap}
.about .bio-details-panel .credential span{line-height:1.5;overflow-wrap:break-word}
@media(max-width:359px){.about .bio-details>summary{padding-block:18px}.about .bio-details-panel .credential{grid-template-columns:42px minmax(0,1fr);gap:10px}}
@media(prefers-reduced-motion:reduce){.about .bio-chevron{transition:none!important}}


/* NOELIA_SCROLLBAR_ROSA_SUTIL: único ajuste — barra de desplazamiento discreta */
html{scrollbar-width:thin;scrollbar-color:rgba(207,0,109,.48) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(207,0,109,.48);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:rgba(207,0,109,.72)}

/* NOELIA_VIDEO_CAROUSEL_V1: Galería continua debajo de la biografía.
   Sin flechas ni encabezados, videos reales y reproducciones bajo demanda de visibilidad. */
.noelia-video-section{background:#0b0b0f;color:#f4f2ee;padding:0 0 64px;overflow:hidden;position:relative;isolation:isolate}
.noelia-video-rule{height:1px;background:#38343c;opacity:.85;max-width:1540px;margin:0 auto 47px}
.noelia-video-viewport{width:100%;overflow:hidden;padding:24px 44px 28px;position:relative;outline:none;touch-action:pan-y pinch-zoom;cursor:grab}
.noelia-video-viewport:active{cursor:grabbing}
.noelia-video-viewport:focus-visible{outline:2px solid #e77baf;outline-offset:-4px}
.noelia-video-track{display:flex;align-items:center;gap:18px;width:max-content;will-change:transform;transform:translate3d(0,0,0)}
.noelia-video-card{flex:0 0 clamp(215px,calc((100vw - 184px)/5),285px);height:clamp(210px,16vw,245px);position:relative;overflow:hidden;border:1px solid #504b56;border-radius:13px;background:#19171d;transform:scale(var(--focus-scale,1));transition:transform .32s ease,border-color .32s ease,box-shadow .32s ease;box-shadow:0 12px 32px #0004;isolation:isolate;cursor:pointer;user-select:none}
.noelia-video-card:hover,.noelia-video-card:focus-visible{border:2px solid #e77baf;box-shadow:0 0 0 1px #ee8ebc45,0 0 22px #cf006d32,0 16px 36px #0007;z-index:2;--focus-scale:1.045}
.noelia-video-card video,.noelia-video-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--video-position,center 48%);filter:brightness(.88) contrast(1.04);background:#19171d;pointer-events:none}
.noelia-video-card video{opacity:0;z-index:1;transition:opacity .2s linear}
.noelia-video-poster{z-index:0}
.noelia-video-card.is-playing video{opacity:1}
.noelia-video-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06050acc 0%,#06050a34 39%,transparent 67%);pointer-events:none;z-index:1}
.noelia-video-duration{position:absolute;right:10px;top:10px;padding:5px 8px;background:#100d13d9;border-radius:14px;color:#fff;font-size:11px;line-height:1;font-weight:700;z-index:2}
.noelia-video-name{position:absolute;left:19px;right:18px;bottom:18px;z-index:2;font-size:clamp(14px,1.1vw,17px);font-weight:800;line-height:1.24;color:#fff;text-shadow:0 1px 5px #000b}
.noelia-video-name:after{content:"";display:block;margin-top:11px;width:39px;height:2px;background:#cf006d}
.noelia-video-open{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%);width:48px;height:48px;display:grid;place-items:center;border-radius:50%;border:1px solid #efafcfb8;background:#6a294abd;color:#ffe2f0;cursor:pointer;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:background .2s,transform .2s}
.noelia-video-open:hover{background:#cf006ddd;transform:translate(-50%,-50%) scale(1.06)}
.noelia-video-open:focus-visible{outline:3px solid #fff;outline-offset:3px}
.noelia-video-open svg{width:16px;height:16px;margin-left:3px}
.noelia-video-tools{max-width:1520px;margin:0 auto;min-height:33px;display:flex;align-items:center;justify-content:center;position:relative}
.noelia-video-dots{display:flex;align-items:center;justify-content:center;gap:13px;min-height:20px}
.noelia-video-dot{border:0;padding:0;width:8px;height:8px;border-radius:50%;background:#77717d;transition:background .2s,transform .2s;cursor:pointer}
.noelia-video-dot[aria-current="true"]{background:#e75a9d;transform:scale(1.35)}
.noelia-video-dot:focus-visible{outline:2px solid white;outline-offset:5px}
.noelia-video-motion{position:absolute;right:46px;top:0;height:31px;min-width:31px;background:#211b23;border:1px solid #504b56;color:#f8e9f1;border-radius:50%;font-size:13px;display:grid;place-items:center}
.noelia-video-motion:focus-visible{outline:2px solid #e77baf;outline-offset:2px}
.noelia-video-modal[hidden]{display:none!important}
.noelia-video-modal{position:fixed;inset:0;z-index:210;background:#08070bea;display:grid;place-items:center;padding:clamp(18px,3vw,48px)}
.noelia-video-modal-inner{width:min(850px,100%);max-height:90dvh;display:flex;flex-direction:column;align-items:stretch;position:relative}
.noelia-video-modal video{width:100%;max-height:75dvh;object-fit:contain;background:#000;border-radius:12px}
.noelia-video-modal-title{margin:12px 0 0;font-size:14px;font-weight:700;color:#f7edf2;text-align:center}
.noelia-video-close{position:absolute;right:0;top:-47px;border:1px solid #aa7b96;color:white;background:#221923;border-radius:50%;width:40px;height:40px;font-size:26px;line-height:1}
@media(min-width:760px) and (max-width:1250px){
 .noelia-video-card{flex-basis:clamp(210px,24vw,260px);height:225px}
}
@media(max-width:759px){
 .noelia-video-section{padding-bottom:46px}
 .noelia-video-rule{margin:0 18px 29px}
 .noelia-video-viewport{padding:20px 16px 22px}
 .noelia-video-track{gap:13px}
 .noelia-video-card{flex-basis:82vw;height:clamp(300px,94vw,380px);border-radius:12px}
 .noelia-video-card:hover,.noelia-video-card:focus-visible{--focus-scale:1.025}
 .noelia-video-name{font-size:15px;left:18px;bottom:17px}
 .noelia-video-motion{right:16px}
 .noelia-video-modal{padding:18px}
}
@media(prefers-reduced-motion:reduce){
 .noelia-video-track,.noelia-video-card,.noelia-video-open,.noelia-video-dot{transition:none!important;animation:none!important}
}


/* NOELIA_VIDEO_AJUSTE_COMPACTO_20261105 — misma sección, sin play ni tiempos. */
.noelia-feature-preview.about{padding-bottom:22px!important}
.noelia-video-rule{margin-bottom:10px}
.noelia-video-viewport{padding-top:18px}
.noelia-video-card{cursor:pointer}
.noelia-video-card:focus-visible{outline:2px solid #e77baf;outline-offset:4px}
@media(max-width:759px){
 .noelia-feature-preview.about{padding-bottom:16px!important}
 .noelia-video-rule{margin-bottom:9px}
 .noelia-video-viewport{padding-top:15px}
}

/* NOELIA_VIDEO_BORDES_SUAVES_20261105 — integrado a la biografía, sin divisor.
   Solo difumina los extremos del carrusel; no filtra ni distorsiona los videos. */
.noelia-video-section{padding-top:0}
.noelia-video-viewport{
  border-radius:24px / 38px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 2.5%,#000 7%,#000 93%,rgba(0,0,0,.5) 97.5%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 2.5%,#000 7%,#000 93%,rgba(0,0,0,.5) 97.5%,transparent 100%);
  padding-top:12px;
}
@media(max-width:759px){
 .noelia-video-viewport{
  border-radius:15px / 25px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.65) 3%,#000 9%,#000 91%,rgba(0,0,0,.65) 97%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.65) 3%,#000 9%,#000 91%,rgba(0,0,0,.65) 97%,transparent 100%);
  padding-top:10px;
 }
}


/* NOELIA_VIDEO_MANUAL_HOVER_20261105 — selección exclusiva en hover/foco, sin controles de pausa. */
.noelia-video-card{cursor:pointer}
.noelia-video-card:hover,.noelia-video-card:focus-visible{filter:brightness(1.08)}
.noelia-video-viewport{overscroll-behavior-x:contain}

/* CARRUSEL_SOLO_VISUAL_20261105 — sin pausa, controles, interacción ni selección.
   Velocidad móvil 58 px/s y PC 45 px/s (tablet 42 px/s). */
.noelia-video-viewport{cursor:default!important;touch-action:pan-y!important}
.noelia-video-viewport:active{cursor:default!important}
.noelia-video-card,.noelia-video-card:hover,.noelia-video-card:focus-visible{
 cursor:default!important;
 --focus-scale:1!important;
 transform:none!important;
 filter:none!important;
 border:1px solid #504b56!important;
 box-shadow:0 12px 32px #0004!important;
}
.noelia-video-card{pointer-events:none}
.noelia-video-tools{display:none!important}
@media(prefers-reduced-motion:reduce){.noelia-video-track{animation:none!important}}
</style>

const NOELIA_HERO_POSTER="/media/poster_mobile.webp";
const NOELIA_OPCION_2_POSTER="/media/poster_desktop.webp";
const NOELIA_MEDIA_CHUNKS={desktop:["media/hero_desktop_01.bin","media/hero_desktop_02.bin","media/hero_desktop_03.bin","media/hero_desktop_04.bin","media/hero_desktop_05.bin","media/hero_desktop_06.bin","media/hero_desktop_07.bin","media/hero_desktop_08.bin","media/hero_desktop_09.bin","media/hero_desktop_10.bin","media/hero_desktop_11.bin","media/hero_desktop_12.bin","media/hero_desktop_13.bin","media/hero_desktop_14.bin"],mobile:["media/hero_mobile_01.bin","media/hero_mobile_02.bin","media/hero_mobile_03.bin","media/hero_mobile_04.bin","media/hero_mobile_05.bin"]};
const noeliaMediaCache={};
function noeliaMediaUrl(type){
 if(!noeliaMediaCache[type]){
  noeliaMediaCache[type]=Promise.all(NOELIA_MEDIA_CHUNKS[type].map(async path=>{
   const res=await fetch("/"+path,{cache:"force-cache"});
   if(!res.ok)throw new Error("Noelia media "+path+" HTTP "+res.status);
   return await res.arrayBuffer();
  })).then(parts=>URL.createObjectURL(new Blob(parts,{type:"video/mp4"})));
 }
 return noeliaMediaCache[type];
}
function noeliaMountMedia(){
 const hero=main.querySelector("#noelia-hero-video");
 if(hero){
  const type=matchMedia("(min-width:760px)").matches?"desktop":"mobile";
  if(type==="mobile"){
   // Video móvil definitivo: dos recortes sin subtítulos unidos y en bucle.
   // Nunca volver al antiguo video subtitulado.
   const mobileSrc="/media/Video_Noelia_Celular.mp4?v=2fb7175";
   const githubSrc="https://raw.githubusercontent.com/alejolunavnc-coder/noelia-perucci-demo/main/media/Video_Noelia_Celular.mp4";
   let usingGithub=false;
   hero.addEventListener("error",()=>{
    if(!hero.isConnected||usingGithub)return;
    usingGithub=true;
    hero.src=githubSrc;
    hero.load();
    hero.play().catch(()=>{});
   });
   hero.src=mobileSrc;
   hero.load();
   hero.play().catch(()=>{});
  }else{
   noeliaMediaUrl(type).then(src=>{if(!hero.isConnected)return;hero.src=src;hero.play().catch(()=>{});}).catch(()=>{});
  }
 }
 const video=main.querySelector("#noelia-workout-video");
 const toggle=main.querySelector("#noelia-play-video");
 if(video&&toggle){
  toggle.addEventListener("click",async()=>{
   if(video.dataset.ready==="1"){
    if(video.paused){video.play().then(()=>{toggle.classList.add("is-playing");video.controls=true;}).catch(()=>{});}
    else{video.pause();video.controls=false;toggle.classList.remove("is-playing");}
    return;
   }
   toggle.disabled=true;toggle.setAttribute("aria-label","Cargando video...");
   try{
    const url=await noeliaMediaUrl("mobile");
    if(!video.isConnected)return;
    video.src=url;video.dataset.ready="1";
    await video.play();
    video.controls=true;toggle.classList.add("is-playing");
   }catch(e){toggle.setAttribute("aria-label","Reintentar video de Noelia");}
   finally{toggle.disabled=false;}
  });
 }
}

const offers=[

{id:'personalizado',number:'02',title:'PLANES<br>PERSONALIZADOS',desc:'Planes personalizados acordes a tu objetivo.',img:'weights.webp',price:'PRECIO A CONFIRMAR',features:['Evaluación y planificación individual','Entrenamiento y nutrición acorde a objetivos','Seguimiento según las condiciones acordadas'],cta:'CONSULTAR POR WHATSAPP',action:'personalizado'}

const trainings=()=>`<div class="page-enter"><section class="plans-hero" data-theme="dark"><div class="wrap">${label('02 / ENTRENAMIENTOS')}<h1>TUS<br>PLANES<span class="plans-period">.</span></h1><p>Dos formas de entrenar. Elegí la que se adapta a vos.</p></div></section><section class="section white plans-list" data-theme="light"><div class="wrap">${label('ENTRENAMIENTO ONLINE',true)}<h2>ELEGÍ CÓMO<br>ENTRENAR.</h2><p class="topcopy">Rutinas ya preparadas o una propuesta personalizada.</p><div class="offer-grid">${offers.map(offer).join('')}</div></div></section><section class="section smoke process" data-theme="light"><div class="wrap">${label('UN PROCESO SIMPLE',true)}<h2>ASÍ FUNCIONA.</h2>${[['01','ELEGÍ','Seleccioná tu nivel y cantidad de días.'],['02','REVISÁ','Conocé el precio de tu rutina antes de comprar.'],['03','DESCARGÁ','Después de un pago aprobado, recibís tu PDF sin depender de una consulta.'],['04','AL RENOVAR','Si querés, podés solicitar un control mensual. Noelia lo revisa y responde por correo.']].map(x=>`<div class="process-row"><code>${x[0]}</code><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}${button('ELEGIR RUTINA','rutina','darkbtn')}${button('CÓMO FUNCIONA EL CONTROL MENSUAL','control','lightoutline')}</div></section>${footer()}</div>`;
const levelChoice=()=>Object.keys(levelNames).map(l=>`<button type="button" class="choice level-choice ${chosenLevel===l?'is-selected':''}" data-level="${l}" aria-pressed="${chosenLevel===l}"><span class="choice-main">${levelNames[l]}</span><span class="choice-indicator" aria-hidden="true"></span></button>`).join('');

let noeliaGalleryReady=null;
function noeliaCheckNewGallery(){
 if(!noeliaGalleryReady){
  noeliaGalleryReady=Promise.all(NOELIA_GALLERY_NEW_VIDEOS.map(async clip=>{
   try{const r=await fetch(clip.src,{method:"HEAD",cache:"no-store"});return r.ok}catch{return false}
  })).then(a=>a.every(Boolean)).catch(()=>false);
 }
 return noeliaGalleryReady;
}
let noeliaCarouselDestroy=()=>{};
function noeliaInitCarousel(){
 const viewport=main.querySelector("#noelia-video-viewport");
 if(!viewport)return;
 noeliaMountGallery(NOELIA_GALLERY_VIDEOS);
 noeliaCheckNewGallery().then(ready=>{
  if(ready&&viewport.isConnected&&current==="inicio")noeliaMountGallery(NOELIA_GALLERY_NEW_VIDEOS);
 });
}
function noeliaMountGallery(clips){
 noeliaCarouselDestroy();
 const viewport=main.querySelector("#noelia-video-viewport");
 const track=main.querySelector("#noelia-video-track");
 if(!viewport||!track)return;
 if(!clips.length)return;
 track.replaceChildren();
 let disposed=false,offset=0,cycleWidth=1,lastTime=0,frame=0;
 const cards=[],visible=new Set();
 const cardCount=Math.max(clips.length*4,8);
 for(let i=0;i<cardCount;i++){
  const clip=clips[i%clips.length];
  const card=document.createElement("article");
  card.className="noelia-video-card";
  card.style.setProperty("--video-position",clip.position);
  card.setAttribute("aria-label",clip.title);
  const poster=document.createElement("img");
  poster.className="noelia-video-poster";poster.src=clip.poster;poster.alt="";poster.loading="lazy";
  const name=document.createElement("span");name.className="noelia-video-name";name.textContent=clip.title;
  card.append(poster,name);track.append(card);
  cards.push({el:card,clip,video:null});
 }
 function ensureVideo(card){
  if(disposed||card.video)return;
  const v=document.createElement("video");
  v.preload="metadata";v.autoplay=true;v.muted=true;v.defaultMuted=true;v.loop=false;
  v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("muted","");
  v.src=card.clip.src;v.style.objectPosition=card.clip.position;v.setAttribute("aria-hidden","true");v.tabIndex=-1;
  const rewind=()=>{
   if(!Number.isFinite(v.duration))return;
   const start=Math.min(card.clip.start,Math.max(0,v.duration-.15));
   if(v.currentTime<start-.15||v.currentTime>=card.clip.end-.035)v.currentTime=start;
  };
  v.addEventListener("loadedmetadata",rewind);
  v.addEventListener("timeupdate",()=>{if(v.currentTime>=card.clip.end-.08)v.currentTime=card.clip.start});
  v.addEventListener("ended",()=>{v.currentTime=card.clip.start;v.play().catch(()=>{})});
  v.addEventListener("playing",()=>card.el.classList.add("is-playing"));
  v.addEventListener("error",()=>card.el.classList.remove("is-playing"));
  card.el.insertBefore(v,card.el.firstChild);card.video=v;
 }
 function pauseVideo(card){
  if(!card.video)return;
  const v=card.video;v.pause();v.removeAttribute("src");v.load();v.remove();
  card.video=null;card.el.classList.remove("is-playing");
 }
 function updatePlayback(){
  const b=viewport.getBoundingClientRect();
  const running=!disposed&&!document.hidden&&b.bottom>0&&b.top<innerHeight;
  cards.forEach(card=>{
   if(running&&visible.has(card)){
    ensureVideo(card);
    if(card.video?.paused)card.video.play().catch(()=>card.el.classList.remove("is-playing"));
   }else pauseVideo(card);
  });
 }
 function measure(){
  if(disposed)return;
  const width=cards[clips.length].el.offsetLeft-cards[0].el.offsetLeft;
  if(width>0){cycleWidth=width;offset%=cycleWidth}
  track.style.transform="translate3d("+(-offset)+"px,0,0)";
 }
 function tick(time){
  if(disposed)return;
  const delta=lastTime?Math.min(50,time-lastTime):0;lastTime=time;
  const b=viewport.getBoundingClientRect();
  if(!document.hidden&&b.bottom>0&&b.top<innerHeight){
   const speed=innerWidth<760?58:innerWidth<1200?42:45;
   offset=(offset+speed*delta/1000)%cycleWidth;
   track.style.transform="translate3d("+(-offset)+"px,0,0)";
  }
  frame=requestAnimationFrame(tick);
 }
 const cardsObserver=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
   const card=cards.find(c=>c.el===entry.target);
   if(!card)return;
   if(entry.isIntersecting)visible.add(card);else visible.delete(card);
  });
  updatePlayback();
 },{root:viewport,rootMargin:"0px 150px",threshold:0});
 cards.forEach(card=>cardsObserver.observe(card.el));
 const sectionObserver=new IntersectionObserver(()=>updatePlayback(),{threshold:0});
 sectionObserver.observe(viewport);
 const onVisibility=()=>updatePlayback(),onResize=()=>measure();
 document.addEventListener("visibilitychange",onVisibility);
 window.addEventListener("resize",onResize);
 noeliaCarouselDestroy=()=>{
  if(disposed)return;
  disposed=true;cancelAnimationFrame(frame);
  cardsObserver.disconnect();sectionObserver.disconnect();
  cards.forEach(pauseVideo);
  document.removeEventListener("visibilitychange",onVisibility);
  window.removeEventListener("resize",onResize);
  noeliaCarouselDestroy=()=>{};
 };
 measure();updatePlayback();frame=requestAnimationFrame(tick);
}

const routes={inicio:home,entrenamientos:trainings,rutina:routine,pago:checkout,confirmacion:success,control:monthly,contacto:contact};
function setMenu(open){menu.classList.toggle('open',open);menu.setAttribute('aria-hidden',String(!open));menu.inert=!open;header.querySelector('#openMenu').setAttribute('aria-expanded',String(open));document.body.classList.toggle('menu-open',open);if(open)document.getElementById('closeMenu').focus()}
function render(route){noeliaCarouselDestroy();current=routes[route]?route:'inicio';setMenu(false);main.innerHTML=routes[current]();window.scrollTo({top:0,behavior:'instant'});document.querySelectorAll('.menu-links a').forEach(a=>a.classList.toggle('current',a.dataset.route===current));if(current==='contacto')main.querySelector('select[name="plan"]').value=interest;if(obs)obs.disconnect();if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion:reduce)').matches){obs=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){x.target.classList.add('is-visible');obs.unobserve(x.target)}}),{threshold:.08});main.querySelectorAll('.reveal').forEach(el=>obs.observe(el))}else main.querySelectorAll('.reveal').forEach(el=>el.classList.add('is-visible'));scrollTheme();noeliaMountMedia();if(current==='inicio')noeliaInitCarousel()}
function goto(route){const hash='#'+route;if(location.hash===hash)render(route);else location.hash=hash}
function scrollTheme(){const progress=document.querySelector('.scroll-progress');if(progress){const max=document.documentElement.scrollHeight-window.innerHeight;progress.style.transform=`scaleX(${max>0?Math.min(1,Math.max(0,window.scrollY/max)):0})`;}let isLight=[...main.querySelectorAll('[data-theme="light"]')].some(el=>{const b=el.getBoundingClientRect();return b.top<70&&b.bottom>70});header.classList.toggle('light',isLight);header.classList.toggle('scrolled',window.scrollY>15)}
function notify(t){clearTimeout(toastTimer);toast.textContent=t;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function syncRoutine(){
  main.querySelectorAll('[data-level]').forEach(b=>{const on=b.dataset.level===chosenLevel;b.classList.toggle('is-selected',on);b.setAttribute('aria-pressed',String(on))});
  main.querySelectorAll('[data-days]').forEach(b=>{const on=Number(b.dataset.days)===chosenDays;b.classList.toggle('is-selected',on);b.setAttribute('aria-pressed',String(on))});
  const n=main.querySelector('#selected-label'),p=main.querySelector('#selected-price');
  if(n)n.textContent=`${levelNames[chosenLevel]} · ${chosenDays} días`;
  if(p)p.textContent=`${price(chosenDays)} ARS`;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#openMenu')){setMenu(true);return}
  if(e.target.closest('#closeMenu')){setMenu(false);return}
  const lvl=e.target.closest('[data-level]');if(lvl){chosenLevel=lvl.dataset.level;syncRoutine();return}
  const day=e.target.closest('[data-days]');if(day){chosenDays=Number(day.dataset.days);syncRoutine();return}
  const link=e.target.closest('[data-route]');if(link){e.preventDefault();goto(link.dataset.route);return}
  const b=e.target.closest('[data-action]');if(b){const act=b.dataset.action;
    if(act==='conoceme'){const sectionIndex=document.querySelector('#noelia .section-index');if(sectionIndex){const headerHeight=document.getElementById('header')?.getBoundingClientRect().height||74;const y=window.scrollY+sectionIndex.getBoundingClientRect().top-(headerHeight+34);window.scrollTo({top:Math.max(0,y),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}return;}
    if(act==='personalizado'){interest='personalizado';goto('contacto')}
    else if(['inicio','entrenamientos','contacto','rutina','pago','confirmacion','control'].includes(act))goto(act);
  }
});
document.addEventListener('submit',e=>{
 if(e.target.id==='checkout-form'){
  e.preventDefault();if(!e.target.reportValidity())return;
  checkoutEmail=String(new FormData(e.target).get('email')||'').slice(0,140);
  goto('confirmacion');notify('Simulación completada · No se realizó ningún cobro.');return;
 }

 if(e.target.id==='monthly-check-form'){
   e.preventDefault();
   if(!e.target.reportValidity())return;
   const f=new FormData(e.target);
   const clean=k=>String(f.get(k)||'').trim();
   const draft=['CONTROL MENSUAL - RENOVACIÓN DE RUTINA','Nombre: '+clean('name'),'Correo: '+clean('email'),'Número de renovación: '+clean('order'),'Rutina: '+clean('level')+' / '+clean('days'),'Evolución y medidas:',clean('progress'),'','Adjunto mis fotografías iniciales y actuales desde mi correo.'].join('\n');
   const preview=document.getElementById('monthly-check-preview');
   preview.textContent=draft;preview.hidden=false;
   document.getElementById('copy-control-message').hidden=false;
   notify('Mensaje listo para copiar. No se envió ni guardó.');
   preview.scrollIntoView({behavior:'smooth',block:'nearest'});
   return;
 }
 if(e.target.id!=='contact-form')return;
 e.preventDefault();const f=new FormData(e.target);
 const plan={general:'Consulta general',integral:'Asesoría integral online',personalizado:'Planes personalizados'}[f.get('plan')]||'Consulta general';
 const msg=`Hola Noelia, soy ${f.get('name')}. Me interesa: ${plan}.${f.get('message')?' '+f.get('message'):''}`;
 const target=document.getElementById('message-preview');target.hidden=false;target.textContent=msg;
 document.getElementById('copy-message').hidden=false;notify('Consulta preparada para copiar. No fue enviada.');
});
document.addEventListener('click',async e=>{if(e.target.closest('#copy-control-message')){const msg=document.getElementById('monthly-check-preview')?.textContent||'';try{await navigator.clipboard.writeText(msg);notify('Mensaje copiado. Adjuntá tus fotos desde tu correo.')}catch{notify('Seleccioná el texto y copialo manualmente.')}return;}if(e.target.closest('#copy-message')){const msg=document.getElementById('message-preview')?.textContent||'';try{await navigator.clipboard.writeText(msg);notify('Texto copiado')}catch{notify('Seleccioná el texto para copiarlo')}}});
document.getElementById('openMenu').addEventListener('click',()=>setMenu(true));document.getElementById('closeMenu').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});window.addEventListener('hashchange',()=>render(decodeURIComponent(location.hash.slice(1))));window.addEventListener('scroll',scrollTheme,{passive:true});render(decodeURIComponent(location.hash.slice(1)||'inicio'));

</script></body></html>
